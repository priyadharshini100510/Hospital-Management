# ===== TiDB Cloud Profile =====
# Activate with: SPRING_PROFILES_ACTIVE=tidb
#
# This profile connects to TiDB Cloud (MySQL-compatible, hosted on AWS).
# TiDB Cloud requires SSL/TLS -- sslMode=VERIFY_IDENTITY is mandatory.
#
# All secrets are read from environment variables.
# Defaults below match the cluster connection info -- override via env vars for safety.

# ----- DataSource -----
spring.datasource.url=jdbc:mysql://${DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_NAME:hospitaldb}?sslMode=VERIFY_IDENTITY&useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:ihDxZZQduC2Cg1p.root}
spring.datasource.password=${DB_PASSWORD:i0uTuz7QitSafp3w}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----- HikariCP Connection Pool -----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ----- Flyway -----
spring.flyway.enabled=true

# ----- Seeding -----
app.data.seed=true

# ----- H2 Console (disabled for cloud DB) -----
spring.h2.console.enabled=false

# ----- Thymeleaf -----
spring.thymeleaf.cache=false

# ----- Server -----
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never

# ----- Logging -----
logging.level.org.springframework.security=INFO
logging.level.com.hospital.hms=DEBUG
logging.level.com.zaxxer.hikari=INFO
