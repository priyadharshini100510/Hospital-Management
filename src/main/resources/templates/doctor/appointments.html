<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Doctor Appointments')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <div>
            <h3 class="section-title mb-1"><i class="bi bi-calendar2-range me-2"></i>Appointments</h3>
            <p class="text-muted mb-0">View, manage, accept or complete patient consultations.</p>
        </div>
        <div class="mt-2 mt-md-0">
            <a th:href="@{/doctor/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-body p-3">
            <form method="get" th:action="@{/doctor/appointments}" class="row g-2 align-items-center">
                <div class="col-auto">
                    <label for="statusSelect" class="col-form-label fw-semibold">Filter by Status:</label>
                </div>
                <div class="col-md-4">
                    <select name="status" id="statusSelect" class="form-select">
                        <option value="" th:selected="${statusFilter == null or statusFilter == ''}">-- All Statuses --</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st.name()}"
                                th:text="${st.name()}"
                                th:selected="${statusFilter == st.name()}">
                            CONFIRMED
                        </option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-filter me-1"></i>Apply Filter</button>
                    <a th:href="@{/doctor/appointments}" class="btn btn-outline-secondary ms-1">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Appointments Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive" th:if="${not #lists.isEmpty(appointments)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Patient</th>
                            <th>Date & Time</th>
                            <th>Reason for Visit</th>
                            <th>Status</th>
                            <th class="text-end pe-3">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="apt : ${appointments}">
                            <td class="ps-3">
                                <div class="fw-bold" th:text="${apt.patient.user.fullName}">Patient Name</div>
                                <small class="text-muted">
                                    <i class="bi bi-telephone me-1"></i><span th:text="${apt.patient.user.phone != null ? apt.patient.user.phone : 'No phone'}">Phone</span>
                                    &bull; <span th:text="${apt.patient.gender != null ? apt.patient.gender : ''}">Gender</span>
                                </small>
                            </td>
                            <td>
                                <div><i class="bi bi-calendar3 me-1 text-primary"></i><span class="fw-semibold" th:text="${apt.appointmentDate}">Date</span></div>
                                <small class="text-muted"><i class="bi bi-clock me-1"></i><span th:text="${apt.appointmentTime}">Time</span></small>
                            </td>
                            <td>
                                <span class="text-muted small" th:text="${apt.reasonForVisit != null and !#strings.isEmpty(apt.reasonForVisit) ? apt.reasonForVisit : 'General Consultation'}">Reason</span>
                            </td>
                            <td>
                                <span class="badge-status" th:classappend="'badge-' + ${apt.status}" th:text="${apt.status}">STATUS</span>
                            </td>
                            <td class="text-end pe-3">
                                <a th:href="@{/doctor/appointments/{id}(id=${apt.id})}" class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-eye me-1"></i>View & Manage
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="text-center py-5" th:if="${#lists.isEmpty(appointments)}">
                <i class="bi bi-calendar-x text-muted display-4 mb-2 d-block"></i>
                <h5 class="text-secondary">No appointments found</h5>
                <p class="text-muted mb-0">There are no appointments matching your filter criteria.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
