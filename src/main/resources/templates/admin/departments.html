<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Hospital Departments')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="section-title mb-1"><i class="bi bi-building-gear me-2"></i>Hospital Departments</h3>
            <p class="text-muted mb-0">Manage clinical specialties and hospital departments.</p>
        </div>
        <div class="mt-2 mt-md-0">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
            </a>
        </div>
    </div>

    <div class="row g-4">
        <!-- Department List Table -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0 fw-bold"><i class="bi bi-hospital text-primary me-2"></i>Active Departments</h5>
                    <span class="badge bg-primary rounded-pill" th:text="${#lists.size(departments)} + ' departments'">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive" th:if="${not #lists.isEmpty(departments)}">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">#</th>
                                    <th>Department Name</th>
                                    <th>Description</th>
                                    <th class="text-end pe-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="dept, iter : ${departments}">
                                    <td class="ps-3 text-muted" th:text="${iter.count}">1</td>
                                    <td>
                                        <div class="fw-bold text-dark" th:text="${dept.name}">Cardiology</div>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${dept.description != null and !#strings.isEmpty(dept.description) ? dept.description : 'No description'}">Desc</small>
                                    </td>
                                    <td class="text-end pe-3">
                                        <!-- Edit Modal Trigger -->
                                        <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                                data-bs-toggle="modal" th:data-bs-target="'#editDeptModal-' + ${dept.id}" title="Edit Department">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <!-- Delete Form -->
                                        <form th:action="@{/admin/departments/{id}/delete(id=${dept.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to delete this department?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Department">
                                                <i class="bi bi-trash3"></i>
                                            </button>
                                        </form>

                                        <!-- Edit Modal -->
                                        <div class="modal fade" th:id="'editDeptModal-' + ${dept.id}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog text-start">
                                                <div class="modal-content">
                                                    <form th:action="@{/admin/departments/{id}/update(id=${dept.id})}" method="post">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Edit Department</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <div class="modal-body">
                                                            <div class="mb-3">
                                                                <label class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
                                                                <input type="text" name="name" class="form-control" th:value="${dept.name}" required/>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-semibold">Description</label>
                                                                <textarea name="description" class="form-control" rows="3" th:text="${dept.description}"></textarea>
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                            <button type="submit" class="btn btn-primary">Save Changes</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center py-5" th:if="${#lists.isEmpty(departments)}">
                        <i class="bi bi-hospital text-muted display-4 mb-2 d-block"></i>
                        <h5 class="text-secondary">No departments found</h5>
                        <p class="text-muted mb-0">Create your first department using the form on the right.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Department Form -->
        <div class="col-lg-5">
            <div class="card shadow-sm sticky-top" style="top: 80px;">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="card-title mb-0 section-title"><i class="bi bi-plus-circle me-2"></i>Add New Department</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/departments}" th:object="${department}" method="post">
                        <div class="mb-3">
                            <label for="deptName" class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="deptName" th:field="*{name}" placeholder="e.g., Neurology, Oncology" required/>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="deptDesc" class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="deptDesc" th:field="*{description}" rows="3" placeholder="Brief overview of clinical specialties in this department..."></textarea>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i>Create Department
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
