<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container text-center py-5">
    <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
    <h2 class="mt-3">Something Went Wrong</h2>
    <p class="text-muted" th:text="${message} ?: 'An unexpected error occurred. Please try again.'"></p>
    <a th:href="@{/}" class="btn btn-primary">Go Home</a>
</div>
</body>
</html>
