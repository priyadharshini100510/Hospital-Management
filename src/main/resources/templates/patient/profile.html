<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/patient/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page">My Profile</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom d-flex align-items-center">
                    <div class="doctor-avatar me-3" style="width: 48px; height: 48px; font-size: 1.2rem;">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div>
                        <h4 class="card-title mb-0 section-title">Patient Profile</h4>
                        <small class="text-muted">Keep your personal and medical information up to date.</small>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/patient/profile}" th:object="${profileDto}" method="post">
                        <h5 class="fw-bold text-primary mb-3"><i class="bi bi-person me-1"></i>Personal Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required/>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="e.g. +91 9876543210"/>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label fw-semibold">Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}"/>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="gender" class="form-label fw-semibold">Gender</label>
                                <select class="form-select" id="gender" th:field="*{gender}">
                                    <option value="">-- Select Gender --</option>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label fw-semibold">Residential Address</label>
                                <textarea class="form-control" id="address" th:field="*{address}" rows="2" placeholder="Street, city, postal code"></textarea>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>
                        </div>

                        <h5 class="fw-bold text-primary mb-3 border-top pt-3"><i class="bi bi-heart-pulse me-1"></i>Medical Information</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="bloodGroup" class="form-label fw-semibold">Blood Group</label>
                                <select class="form-select" id="bloodGroup" th:field="*{bloodGroup}">
                                    <option value="">-- Select Blood Group --</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
                            </div>
                            <div class="col-12">
                                <label for="allergies" class="form-label fw-semibold">Known Allergies / Medical Conditions</label>
                                <textarea class="form-control" id="allergies" th:field="*{allergies}" rows="2" placeholder="e.g. Penicillin, Peanuts, Asthma, etc."></textarea>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('allergies')}" th:errors="*{allergies}"></div>
                            </div>
                        </div>

                        <h5 class="fw-bold text-primary mb-3 border-top pt-3"><i class="bi bi-telephone-plus me-1"></i>Emergency Contact</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="emergencyContactName" class="form-label fw-semibold">Contact Person Name</label>
                                <input type="text" class="form-control" id="emergencyContactName" th:field="*{emergencyContactName}" placeholder="Relative or Guardian name"/>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('emergencyContactName')}" th:errors="*{emergencyContactName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="emergencyContactPhone" class="form-label fw-semibold">Contact Phone Number</label>
                                <input type="tel" class="form-control" id="emergencyContactPhone" th:field="*{emergencyContactPhone}" placeholder="Emergency contact phone"/>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('emergencyContactPhone')}" th:errors="*{emergencyContactPhone}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/patient/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i>Save Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
