<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Patient Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-4">
    <h3 class="section-title">Welcome, <span th:text="${patient.user.fullName}">Patient</span></h3>
    <p class="text-muted">Here's a quick look at your care.</p>

    <div class="row g-3 my-2">
        <div class="col-md-4">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <div class="stat-value" th:text="${upcomingCount}">0</div>
                    <div class="text-muted">Upcoming Appointments</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <div class="stat-value" th:text="${totalAppointments}">0</div>
                    <div class="text-muted">Total Appointments</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <a th:href="@{/patient/appointments/book}" class="btn btn-primary w-100 mt-1">
                        <i class="bi bi-calendar-plus me-1"></i> Book Appointment
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm my-4" th:if="${nextAppointment != null}">
        <div class="card-body">
            <h5 class="card-title"><i class="bi bi-calendar-event me-1"></i> Next Appointment</h5>
            <p class="mb-1"><strong th:text="${nextAppointment.doctor.user.fullName}">Dr. Name</strong>
                &mdash; <span th:text="${nextAppointment.doctor.specialization}">Specialization</span></p>
            <p class="mb-1">
                <i class="bi bi-calendar3 me-1"></i> <span th:text="${nextAppointment.appointmentDate}">Date</span>
                &nbsp;|&nbsp; <i class="bi bi-clock me-1"></i> <span th:text="${nextAppointment.appointmentTime}">Time</span>
            </p>
            <span class="badge-status" th:classappend="'badge-' + ${nextAppointment.status}" th:text="${nextAppointment.status}">STATUS</span>
        </div>
    </div>
    <div class="alert alert-light border my-4" th:if="${nextAppointment == null}">
        You have no upcoming appointments. <a th:href="@{/patient/appointments/book}">Book one now</a>.
    </div>

    <div class="row g-3">
        <div class="col-md-3">
            <a th:href="@{/patient/appointments/book}" class="btn btn-outline-primary w-100 py-3">
                <i class="bi bi-calendar-plus d-block fs-4 mb-1"></i> Book Appointment
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/patient/appointments}" class="btn btn-outline-primary w-100 py-3">
                <i class="bi bi-list-check d-block fs-4 mb-1"></i> My Appointments
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/patient/history}" class="btn btn-outline-primary w-100 py-3">
                <i class="bi bi-file-medical d-block fs-4 mb-1"></i> Medical History
            </a>
        </div>
        <div class="col-md-3">
            <a th:href="@{/patient/profile}" class="btn btn-outline-primary w-100 py-3">
                <i class="bi bi-person-gear d-block fs-4 mb-1"></i> My Profile
            </a>
        </div>
    </div>
</div>
</body>
</html>
