<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointments | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Appointment Schedule</h2>
                <p class="text-muted small mb-0">View, confirm, and complete patient consultations</p>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <label for="statusFilter" class="small fw-semibold text-muted text-nowrap">Filter Status:</label>
                <select id="statusFilter" class="form-select form-select-sm" style="min-width: 150px;">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading appointment records...</p>
        </div>

        <div class="card shadow-sm border-0" id="appointmentsCard" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small">
                        <tr>
                            <th>Date & Time</th>
                            <th>Patient</th>
                            <th>Reason for Visit</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsList"></tbody>
                </table>
            </div>
        </div>

        <div id="noAppointments" class="text-center py-5" style="display: none;">
            <i class="bi bi-calendar2-x fs-1 text-muted"></i>
            <h5 class="fw-bold mt-2">No Appointments Found</h5>
            <p class="text-muted small">There are no appointments matching the selected criteria.</p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_DOCTOR');
            if (!user) return;

            renderNavbar('appointments');
            renderFooter();

            const statusFilter = document.getElementById('statusFilter');
            statusFilter.addEventListener('change', () => loadAppointments(statusFilter.value));

            loadAppointments();
        });

        async function loadAppointments(status = '') {
            const loading = document.getElementById('loading');
            const card = document.getElementById('appointmentsCard');
            const empty = document.getElementById('noAppointments');
            const tbody = document.getElementById('appointmentsList');

            loading.style.display = 'block';
            card.style.display = 'none';
            empty.style.display = 'none';

            try {
                const url = status ? `/api/doctor/appointments?status=${status}` : '/api/doctor/appointments';
                const appts = await api.get(url);

                loading.style.display = 'none';

                if (!appts || appts.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                tbody.innerHTML = appts.map(a => `
                    <tr>
                        <td>
                            <div class="fw-semibold text-dark">${a.date}</div>
                            <small class="text-muted"><i class="bi bi-clock me-1"></i>${a.time}</small>
                        </td>
                        <td>
                            <div class="fw-semibold text-dark">${a.patientName}</div>
                            <small class="text-muted">Patient #${a.patientId}</small>
                        </td>
                        <td>
                            <small class="text-muted">${a.reason || 'Routine consultation'}</small>
                        </td>
                        <td>
                            <span class="badge badge-status badge-${a.status}">${a.status}</span>
                        </td>
                        <td class="text-end">
                            <a href="/frontend/doctor/appointment-detail.html?id=${a.id}" class="btn btn-outline-primary btn-sm fw-medium">
                                Manage &rarr;
                            </a>
                        </td>
                    </tr>
                `).join('');

                card.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                showAlert('danger', 'Failed to load appointments.');
            }
        }
    </script>
</body>
</html>
