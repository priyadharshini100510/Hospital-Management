<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Patients | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Assigned Patients</h2>
                <p class="text-muted small mb-0">Patients who have booked consultations with your clinic</p>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading patient directory...</p>
        </div>

        <div class="card shadow-sm border-0" id="patientsCard" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small">
                        <tr>
                            <th>Patient ID</th>
                            <th>Patient Name</th>
                            <th>Appointment Date</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody id="patientsList"></tbody>
                </table>
            </div>
        </div>

        <div id="noPatients" class="text-center py-5" style="display: none;">
            <i class="bi bi-people fs-1 text-muted"></i>
            <h5 class="fw-bold mt-2">No Patients Found</h5>
            <p class="text-muted small">You currently have no patient appointments booked.</p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_DOCTOR');
            if (!user) return;

            renderNavbar('patients');
            renderFooter();

            const loading = document.getElementById('loading');
            const card = document.getElementById('patientsCard');
            const empty = document.getElementById('noPatients');
            const tbody = document.getElementById('patientsList');

            try {
                const appts = await api.get('/api/doctor/patients');
                loading.style.display = 'none';

                if (!appts || appts.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                tbody.innerHTML = appts.map(a => `
                    <tr>
                        <td><span class="badge bg-light text-muted border">#${a.patientId || a.id}</span></td>
                        <td>
                            <div class="fw-bold text-dark">${a.patientName}</div>
                            <small class="text-muted">${a.reason || 'General checkup'}</small>
                        </td>
                        <td>
                            <div>${a.date}</div>
                            <small class="text-muted">${a.time}</small>
                        </td>
                        <td>
                            <span class="badge badge-status badge-${a.status}">${a.status}</span>
                        </td>
                        <td class="text-end">
                            <a href="/doctor/appointment-detail.html?id=${a.id}" class="btn btn-outline-primary btn-sm">
                                View Consultation &rarr;
                            </a>
                        </td>
                    </tr>
                `).join('');

                card.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                showAlert('danger', 'Failed to load patients list.');
            }
        });
    </script>
</body>
</html>
