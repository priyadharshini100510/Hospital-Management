<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Doctor Profile</h2>
                <p class="text-muted small mb-0">Your physician credentials and clinic profile</p>
            </div>
            <a href="/doctor/dashboard.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="doctor-avatar" id="avatar" style="width: 72px; height: 72px; font-size: 1.8rem;">D</div>
                        <div>
                            <h4 class="fw-bold mb-1" id="profileName">Dr. Name</h4>
                            <span class="badge bg-light text-primary border" id="profileDept">Department</span>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Email Address</label>
                            <input type="text" class="form-control bg-light" id="docEmail" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Phone Number</label>
                            <input type="text" class="form-control bg-light" id="docPhone" disabled>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Specialization</label>
                            <input type="text" class="form-control bg-light" id="docSpec" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Qualification</label>
                            <input type="text" class="form-control bg-light" id="docQual" disabled>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Experience (Years)</label>
                            <input type="text" class="form-control bg-light" id="docExp" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Consultation Fee ($)</label>
                            <input type="text" class="form-control bg-light" id="docFee" disabled>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Professional Biography</label>
                        <textarea class="form-control bg-light" id="docBio" rows="3" disabled></textarea>
                    </div>

                    <div class="alert alert-info small d-flex align-items-center mb-0 mt-3">
                        <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                        <span>To update specialized credentials, fee schedules, or department assignments, please contact the hospital system administrator.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_DOCTOR');
            if (!user) return;

            renderNavbar('dashboard');
            renderFooter();

            try {
                const doc = await api.get('/api/doctor/profile');
                document.getElementById('profileName').textContent = `Dr. ${doc.name}`;
                document.getElementById('avatar').textContent = doc.name ? doc.name.charAt(0).toUpperCase() : 'D';
                document.getElementById('profileDept').textContent = doc.department || 'General';
                document.getElementById('docEmail').value = doc.email || '';
                document.getElementById('docPhone').value = doc.phone || 'Not provided';
                document.getElementById('docSpec').value = doc.specialization || 'General Physician';
                document.getElementById('docQual').value = doc.qualification || 'MBBS / MD';
                document.getElementById('docExp').value = `${doc.experienceYears || 0} Years`;
                document.getElementById('docFee').value = `$${doc.consultationFee || 0}`;
                document.getElementById('docBio').value = doc.bio || 'No biography entered.';
            } catch (err) {
                showAlert('danger', 'Failed to load doctor profile.');
            }
        });
    </script>
</body>
</html>
