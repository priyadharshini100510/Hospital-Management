<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Patients | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Registered Patients</h2>
                <p class="text-muted small mb-0">Browse hospital patient records and medical histories</p>
            </div>
            <div class="d-flex gap-2">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search patient name, email..." style="max-width: 260px;">
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading patient directory...</p>
        </div>

        <div class="card shadow-sm border-0" id="patientsCard" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small">
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Contact Info</th>
                            <th>Gender / DOB</th>
                            <th>Blood Group</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patientsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_ADMIN');
            if (!user) return;

            renderNavbar('patients');
            renderFooter();

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => loadPatients(searchInput.value.trim()));

            loadPatients();
        });

        async function loadPatients(q = '') {
            const loading = document.getElementById('loading');
            const card = document.getElementById('patientsCard');
            const tbody = document.getElementById('patientsList');

            try {
                const url = q ? `/api/admin/patients?q=${encodeURIComponent(q)}` : '/api/admin/patients';
                const patients = await api.get(url);
                loading.style.display = 'none';

                tbody.innerHTML = patients.map(p => `
                    <tr>
                        <td><span class="badge bg-light text-muted border">#${p.id}</span></td>
                        <td>
                            <div class="fw-bold text-dark">${p.fullName}</div>
                            <small class="text-muted">${p.email}</small>
                        </td>
                        <td>
                            <div class="small text-dark">${p.phone || 'No phone'}</div>
                            <small class="text-muted">${p.address || ''}</small>
                        </td>
                        <td>
                            <div class="small">${p.gender || '-'}</div>
                            <small class="text-muted">${p.dateOfBirth || '-'}</small>
                        </td>
                        <td>
                            <span class="badge bg-danger-subtle text-danger fw-semibold">${p.bloodGroup || 'N/A'}</span>
                        </td>
                        <td class="text-end">
                            <a href="/admin/patient-detail.html?id=${p.id}" class="btn btn-outline-primary btn-sm">
                                View Profile & History &rarr;
                            </a>
                        </td>
                    </tr>
                `).join('');

                card.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                showAlert('danger', 'Failed to load patients list.');
            }
        }
    </script>
</body>
</html>
