<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Appointments | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Master Appointments</h2>
                <p class="text-muted small mb-0">Monitor hospital-wide consultation schedules, status, and bookings</p>
            </div>
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <input type="date" id="dateFilter" class="form-control form-control-sm" style="max-width: 170px;">
                <select id="statusFilter" class="form-select form-select-sm" style="max-width: 160px;">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
                <button class="btn btn-outline-secondary btn-sm" id="resetBtn">Reset</button>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading hospital appointments...</p>
        </div>

        <div class="card shadow-sm border-0" id="appointmentsCard" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small">
                        <tr>
                            <th>Date & Time</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Department</th>
                            <th>Reason</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsList"></tbody>
                </table>
            </div>
        </div>

        <div id="noAppointments" class="text-center py-5" style="display: none;">
            <i class="bi bi-calendar2-x fs-1 text-muted"></i>
            <h5 class="fw-bold mt-2">No Appointments Match</h5>
            <p class="text-muted small">Try modifying your date or status filters.</p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_ADMIN');
            if (!user) return;

            renderNavbar('appointments');
            renderFooter();

            const dateFilter = document.getElementById('dateFilter');
            const statusFilter = document.getElementById('statusFilter');
            const resetBtn = document.getElementById('resetBtn');

            function applyFilters() {
                loadAppointments(dateFilter.value, statusFilter.value);
            }

            dateFilter.addEventListener('change', applyFilters);
            statusFilter.addEventListener('change', applyFilters);
            resetBtn.addEventListener('click', () => {
                dateFilter.value = '';
                statusFilter.value = '';
                loadAppointments();
            });

            loadAppointments();
        });

        async function loadAppointments(date = '', status = '') {
            const loading = document.getElementById('loading');
            const card = document.getElementById('appointmentsCard');
            const empty = document.getElementById('noAppointments');
            const tbody = document.getElementById('appointmentsList');

            loading.style.display = 'block';
            card.style.display = 'none';
            empty.style.display = 'none';

            try {
                const params = new URLSearchParams();
                if (date) params.append('date', date);
                if (status) params.append('status', status);

                const query = params.toString();
                const url = query ? `/api/admin/appointments?${query}` : '/api/admin/appointments';
                const appts = await api.get(url);

                loading.style.display = 'none';

                if (!appts || appts.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                tbody.innerHTML = appts.map(a => `
                    <tr>
                        <td>
                            <div class="fw-semibold text-dark">${a.date}</div>
                            <small class="text-muted"><i class="bi bi-clock me-1"></i>${a.time}</small>
                        </td>
                        <td>
                            <div class="fw-semibold text-dark">${a.patientName}</div>
                        </td>
                        <td>
                            <div>Dr. ${a.doctorName}</div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border">${a.department || 'General'}</span>
                        </td>
                        <td>
                            <small class="text-muted">${a.reason || 'General visit'}</small>
                        </td>
                        <td>
                            <span class="badge badge-status badge-${a.status}">${a.status}</span>
                        </td>
                    </tr>
                `).join('');

                card.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                showAlert('danger', 'Failed to load master appointments.');
            }
        }
    </script>
</body>
</html>
