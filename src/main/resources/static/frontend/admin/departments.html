<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Departments | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Medical Departments</h2>
                <p class="text-muted small mb-0">Organize hospital specializations and clinical units</p>
            </div>
            <button class="btn btn-primary shadow-sm" onclick="openDeptModal()">
                <i class="bi bi-plus-circle me-1"></i> New Department
            </button>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading departments...</p>
        </div>

        <div class="card shadow-sm border-0" id="departmentsCard" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small">
                        <tr>
                            <th>Department ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="departmentsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Department Modal (Create / Edit) -->
    <div class="modal fade" id="deptModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="deptModalTitle">Department</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="deptForm">
                    <div class="modal-body">
                        <input type="hidden" id="deptId">
                        <div class="mb-3">
                            <label for="deptName" class="form-label fw-semibold small">Department Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="deptName" required placeholder="e.g. Cardiology, Neurology">
                        </div>
                        <div class="mb-3">
                            <label for="deptDesc" class="form-label fw-semibold small">Description</label>
                            <textarea class="form-control" id="deptDesc" rows="3" placeholder="Clinical scope and services provided..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="saveDeptBtn" class="btn btn-primary">Save Department</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        let deptModalInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_ADMIN');
            if (!user) return;

            renderNavbar('departments');
            renderFooter();

            deptModalInstance = new bootstrap.Modal(document.getElementById('deptModal'));

            loadDepartments();

            document.getElementById('deptForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const saveBtn = document.getElementById('saveDeptBtn');
                const id = document.getElementById('deptId').value;
                const payload = {
                    name: document.getElementById('deptName').value.trim(),
                    description: document.getElementById('deptDesc').value.trim() || null
                };

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

                try {
                    if (id) {
                        await api.put(`/api/admin/departments/${id}`, payload);
                        showAlert('success', 'Department updated successfully.');
                    } else {
                        await api.post('/api/admin/departments', payload);
                        showAlert('success', 'Department created successfully.');
                    }
                    deptModalInstance.hide();
                    loadDepartments();
                } catch (err) {
                    showAlert('danger', err.message || 'Operation failed.');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Department';
                }
            });
        });

        async function loadDepartments() {
            const loading = document.getElementById('loading');
            const card = document.getElementById('departmentsCard');
            const tbody = document.getElementById('departmentsList');

            loading.style.display = 'block';
            card.style.display = 'none';

            try {
                const depts = await api.get('/api/admin/departments');
                loading.style.display = 'none';

                tbody.innerHTML = depts.map(d => `
                    <tr>
                        <td><span class="badge bg-light text-muted border">#${d.id}</span></td>
                        <td class="fw-bold text-dark">${d.name}</td>
                        <td class="text-muted small">${d.description || '-'}</td>
                        <td class="text-end">
                            <button class="btn btn-outline-primary btn-sm me-1" onclick="editDept(${d.id}, '${escapeQuotes(d.name)}', '${escapeQuotes(d.description || '')}')">
                                <i class="bi bi-pencil me-1"></i> Edit
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteDept(${d.id})">
                                <i class="bi bi-trash me-1"></i> Delete
                            </button>
                        </td>
                    </tr>
                `).join('');

                card.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                showAlert('danger', 'Failed to load departments.');
            }
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'");
        }

        function openDeptModal() {
            document.getElementById('deptId').value = '';
            document.getElementById('deptName').value = '';
            document.getElementById('deptDesc').value = '';
            document.getElementById('deptModalTitle').textContent = 'Add New Department';
            deptModalInstance.show();
        }

        function editDept(id, name, desc) {
            document.getElementById('deptId').value = id;
            document.getElementById('deptName').value = name;
            document.getElementById('deptDesc').value = desc;
            document.getElementById('deptModalTitle').textContent = 'Edit Department';
            deptModalInstance.show();
        }

        async function deleteDept(id) {
            if (!confirm('Are you sure you want to delete this department?')) return;
            try {
                await api.delete(`/api/admin/departments/${id}`);
                showAlert('success', 'Department deleted.');
                loadDepartments();
            } catch (err) {
                showAlert('danger', err.message || 'Failed to delete department.');
            }
        }
    </script>
</body>
</html>
