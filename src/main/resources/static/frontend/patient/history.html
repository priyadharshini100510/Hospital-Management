<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical History | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Medical History</h2>
                <p class="text-muted small mb-0">Past completed consultations, physician diagnoses, and prescriptions</p>
            </div>
            <a href="/patient/appointments.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Appointments
            </a>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading your medical records...</p>
        </div>

        <div id="historyList" class="row g-4" style="display: none;"></div>

        <div id="noHistory" class="text-center py-5" style="display: none;">
            <i class="bi bi-journal-medical fs-1 text-muted"></i>
            <h5 class="fw-bold mt-2">No Medical Records Found</h5>
            <p class="text-muted small">Completed appointments with doctor notes will appear here.</p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_PATIENT');
            if (!user) return;

            renderNavbar('history');
            renderFooter();

            const loading = document.getElementById('loading');
            const historyList = document.getElementById('historyList');
            const noHistory = document.getElementById('noHistory');

            try {
                const records = await api.get('/api/patient/history');
                loading.style.display = 'none';

                if (!records || records.length === 0) {
                    noHistory.style.display = 'block';
                    return;
                }

                historyList.innerHTML = records.map(rec => {
                    const notes = rec.notes || {};
                    return `
                        <div class="col-12">
                            <div class="card shadow-sm border-0">
                                <div class="card-header bg-light d-flex justify-content-between align-items-center py-3">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-calendar2-check text-success fs-5"></i>
                                        <span class="fw-bold text-dark">${rec.date}</span>
                                        <span class="text-muted small">at ${rec.time}</span>
                                    </div>
                                    <div>
                                        <span class="badge bg-light text-primary border me-2">${rec.department || 'General'}</span>
                                        <span class="badge bg-success-subtle text-success">Completed</span>
                                    </div>
                                </div>
                                <div class="card-body p-4">
                                    <div class="row g-3">
                                        <div class="col-md-4 border-end-md">
                                            <div class="text-muted small fw-semibold text-uppercase">Attending Physician</div>
                                            <div class="fw-bold fs-6 mt-1">Dr. ${rec.doctorName}</div>
                                            ${rec.reason ? `<div class="text-muted small mt-2"><strong>Reason for Visit:</strong> ${rec.reason}</div>` : ''}
                                        </div>
                                        <div class="col-md-8">
                                            <div class="mb-3">
                                                <div class="fw-semibold text-dark small text-uppercase">Diagnosis</div>
                                                <div class="text-dark mt-1 p-2 bg-light rounded">${notes.diagnosis || 'Clinical consultation conducted.'}</div>
                                            </div>
                                            <div class="mb-3">
                                                <div class="fw-semibold text-dark small text-uppercase">Prescription & Medication</div>
                                                <div class="text-dark mt-1 p-2 bg-light rounded font-monospace small">${notes.prescription || 'None prescribed.'}</div>
                                            </div>
                                            ${notes.followUpAdvice ? `
                                                <div>
                                                    <div class="fw-semibold text-dark small text-uppercase">Follow-up Advice</div>
                                                    <div class="text-muted small mt-1">${notes.followUpAdvice}</div>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                historyList.style.display = 'flex';
            } catch (err) {
                loading.style.display = 'none';
                showAlert('danger', 'Failed to load medical history records.');
            }
        });
    </script>
</body>
</html>
