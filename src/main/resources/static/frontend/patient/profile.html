<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profile | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">My Health Profile</h2>
                <p class="text-muted small mb-0">Update your personal and emergency medical information</p>
            </div>
            <a href="/frontend/patient/dashboard.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4">
                    <form id="profileForm">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <input type="email" class="form-control bg-light" id="email" disabled>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="phone" class="form-label fw-semibold small">Phone Number</label>
                                <input type="tel" class="form-control" id="phone">
                            </div>
                            <div class="col-md-4">
                                <label for="dateOfBirth" class="form-label fw-semibold small">Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth">
                            </div>
                            <div class="col-md-4">
                                <label for="gender" class="form-label fw-semibold small">Gender</label>
                                <select class="form-select" id="gender">
                                    <option value="">Select...</option>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="bloodGroup" class="form-label fw-semibold small">Blood Group</label>
                                <select class="form-select" id="bloodGroup">
                                    <option value="">Select Blood Group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="emergencyContactName" class="form-label fw-semibold small">Emergency Contact Name</label>
                                <input type="text" class="form-control" id="emergencyContactName">
                            </div>
                            <div class="col-md-4">
                                <label for="emergencyContactPhone" class="form-label fw-semibold small">Emergency Contact Phone</label>
                                <input type="tel" class="form-control" id="emergencyContactPhone">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold small">Address</label>
                            <textarea class="form-control" id="address" rows="2"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="allergies" class="form-label fw-semibold small">Known Allergies / Medical Conditions</label>
                            <textarea class="form-control" id="allergies" rows="2" placeholder="e.g. Penicillin, Peanuts, Asthma"></textarea>
                        </div>

                        <button type="submit" id="saveBtn" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-save me-1"></i> Save Profile Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_PATIENT');
            if (!user) return;

            renderNavbar('dashboard');
            renderFooter();

            const profileForm = document.getElementById('profileForm');
            const saveBtn = document.getElementById('saveBtn');

            // Load existing profile
            try {
                const profile = await api.get('/api/patient/profile');
                document.getElementById('fullName').value = profile.fullName || '';
                document.getElementById('email').value = profile.email || '';
                document.getElementById('phone').value = profile.phone || '';
                document.getElementById('dateOfBirth').value = profile.dateOfBirth || '';
                document.getElementById('gender').value = profile.gender || '';
                document.getElementById('bloodGroup').value = profile.bloodGroup || '';
                document.getElementById('emergencyContactName').value = profile.emergencyContactName || '';
                document.getElementById('emergencyContactPhone').value = profile.emergencyContactPhone || '';
                document.getElementById('address').value = profile.address || '';
                document.getElementById('allergies').value = profile.allergies || '';
            } catch (err) {
                showAlert('danger', 'Failed to load profile data.');
            }

            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const payload = {
                    fullName: document.getElementById('fullName').value.trim(),
                    phone: document.getElementById('phone').value.trim() || null,
                    dateOfBirth: document.getElementById('dateOfBirth').value || null,
                    gender: document.getElementById('gender').value || null,
                    bloodGroup: document.getElementById('bloodGroup').value || null,
                    emergencyContactName: document.getElementById('emergencyContactName').value.trim() || null,
                    emergencyContactPhone: document.getElementById('emergencyContactPhone').value.trim() || null,
                    address: document.getElementById('address').value.trim() || null,
                    allergies: document.getElementById('allergies').value.trim() || null
                };

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

                try {
                    const res = await api.put('/api/patient/profile', payload);
                    showAlert('success', (res && res.message) || 'Profile updated successfully.');
                } catch (err) {
                    showAlert('danger', err.message || 'Failed to update profile.');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="bi bi-save me-1"></i> Save Profile Changes';
                }
            });
        });
    </script>
</body>
</html>
