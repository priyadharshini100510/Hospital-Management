<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Doctor | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container py-4">
        <div id="alert-container"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Find a Specialist</h2>
                <p class="text-muted small mb-0">Browse qualified medical doctors and schedule appointments</p>
            </div>
            <div class="w-100 w-md-auto" style="max-width: 380px;">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search doctor, dept, specialty...">
                    <button class="btn btn-primary" id="searchBtn">Search</button>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="loading-spinner mb-2"></div>
            <p class="text-muted small">Loading doctors directory...</p>
        </div>

        <div class="row g-4" id="doctorsGrid" style="display: none;"></div>

        <div id="noResults" class="text-center py-5" style="display: none;">
            <i class="bi bi-person-x fs-1 text-muted"></i>
            <h5 class="fw-bold mt-2">No Doctors Found</h5>
            <p class="text-muted small">Try adjusting your search criteria.</p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.requireAuth('ROLE_PATIENT');
            if (!user) return;

            renderNavbar('doctors');
            renderFooter();

            const doctorsGrid = document.getElementById('doctorsGrid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('noResults');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            async function fetchDoctors(query = '') {
                loading.style.display = 'block';
                doctorsGrid.style.display = 'none';
                noResults.style.display = 'none';

                try {
                    const url = query ? `/api/patient/doctors?q=${encodeURIComponent(query)}` : '/api/patient/doctors';
                    const doctors = await api.get(url);

                    loading.style.display = 'none';

                    if (!doctors || doctors.length === 0) {
                        noResults.style.display = 'block';
                        return;
                    }

                    doctorsGrid.innerHTML = doctors.map(doc => `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100 doctor-card shadow-sm border-0 p-3">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex align-items-center gap-3 mb-3">
                                        <div class="doctor-avatar">
                                            ${doc.name ? doc.name.charAt(0).toUpperCase() : 'D'}
                                        </div>
                                        <div>
                                            <h5 class="fw-bold mb-0">Dr. ${doc.name}</h5>
                                            <span class="badge bg-light text-primary border">${doc.department || 'General'}</span>
                                        </div>
                                    </div>
                                    <p class="text-muted small mb-2"><strong>Specialization:</strong> ${doc.specialization || 'General Physician'}</p>
                                    <p class="text-muted small mb-2"><strong>Qualification:</strong> ${doc.qualification || 'MD'}</p>
                                    <div class="d-flex justify-content-between align-items-center small text-muted mb-3">
                                        <span><i class="bi bi-award me-1"></i>${doc.experienceYears || 0} Years Exp.</span>
                                        <span class="fw-bold text-dark fs-6">$${doc.consultationFee || 0}</span>
                                    </div>
                                    <div class="mt-auto pt-2 border-top">
                                        <a href="/frontend/patient/doctor-detail.html?id=${doc.id}" class="btn btn-outline-primary btn-sm w-100 fw-semibold">
                                            <i class="bi bi-calendar-check me-1"></i> View Slots & Book
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    doctorsGrid.style.display = 'flex';
                } catch (err) {
                    loading.style.display = 'none';
                    showAlert('danger', 'Failed to load doctors.');
                }
            }

            searchBtn.addEventListener('click', () => fetchDoctors(searchInput.value.trim()));
            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') fetchDoctors(searchInput.value.trim());
            });

            fetchDoctors();
        });
    </script>
</body>
</html>
