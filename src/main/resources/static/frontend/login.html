<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-auto py-5">
        <div class="auth-card">
            <div id="alert-container"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="doctor-avatar mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.4rem;">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Sign In</h3>
                        <p class="text-muted small">Access your patient, doctor, or administrator portal</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="username" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            Sign In
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-muted small mb-0">Don't have an account? 
                            <a href="/register.html" class="text-primary fw-semibold text-decoration-none">Sign up as Patient</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderNavbar('login');
            renderFooter();

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('logout')) {
                showAlert('info', 'You have been successfully logged out.');
            }
            if (urlParams.has('expired')) {
                showAlert('warning', 'Your session has expired. Please log in again.');
            }

            // If already logged in, redirect to dashboard
            const user = await auth.checkAuth();
            if (user) {
                if (user.role === 'ROLE_ADMIN') window.location.href = '/admin/dashboard.html';
                else if (user.role === 'ROLE_DOCTOR') window.location.href = '/doctor/dashboard.html';
                else window.location.href = '/patient/dashboard.html';
                return;
            }

            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing In...';

                try {
                    const res = await auth.login(email, password);
                    if (res.role === 'ROLE_ADMIN') {
                        window.location.href = '/admin/dashboard.html';
                    } else if (res.role === 'ROLE_DOCTOR') {
                        window.location.href = '/doctor/dashboard.html';
                    } else {
                        window.location.href = '/patient/dashboard.html';
                    }
                } catch (err) {
                    showAlert('danger', err.message || 'Login failed. Please check credentials.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });
        });
    </script>
</body>
</html>
