<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | MediCare HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-auto py-5">
        <div class="auth-card" style="max-width: 540px;">
            <div id="alert-container"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="doctor-avatar mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.4rem; background: linear-gradient(135deg, #0f766e, #0d9488);">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Patient Registration</h3>
                        <p class="text-muted small">Create your account to book doctor consultations and manage your health records</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" required placeholder="e.g. John Doe">
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold small">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" required placeholder="john@example.com">
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" required minlength="6" placeholder="Min 6 characters">
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold small">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000">
                            </div>
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label fw-semibold small">Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="gender" class="form-label fw-semibold small">Gender</label>
                            <select class="form-select" id="gender">
                                <option value="">Select Gender...</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="address" class="form-label fw-semibold small">Address</label>
                            <textarea class="form-control" id="address" rows="2" placeholder="Street address, City, State"></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-muted small mb-0">Already registered? 
                            <a href="/login.html" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('register');
            renderFooter();

            const registerForm = document.getElementById('registerForm');
            const submitBtn = document.getElementById('submitBtn');

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const payload = {
                    fullName: document.getElementById('fullName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    phone: document.getElementById('phone').value.trim(),
                    dateOfBirth: document.getElementById('dateOfBirth').value || null,
                    gender: document.getElementById('gender').value || null,
                    address: document.getElementById('address').value.trim() || null
                };

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

                try {
                    const res = await auth.register(payload);
                    showAlert('success', (res && res.message) || 'Registration successful! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } catch (err) {
                    showAlert('danger', err.message || 'Registration failed. Please verify inputs.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            });
        });
    </script>
</body>
</html>
