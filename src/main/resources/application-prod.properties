# ===== Production profile =====
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# All secrets/connection details come from environment variables â€” nothing
# sensitive is hardcoded here. See README "Deploying to production" section
# for the full list of variables to set on your host/platform.
#
# ---- TiDB Cloud usage ----
# Set DATABASE_URL to the full JDBC URL with SSL params, e.g.:
#   DATABASE_URL=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/sys?sslMode=VERIFY_IDENTITY&useSSL=true&requireSSL=true&serverTimezone=UTC
# Or let the app build the URL from individual vars:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD

# ----- Database -----
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_NAME:hospitaldb}?sslMode=VERIFY_IDENTITY&useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:${DB_USER:ihDxZZQduC2Cg1p.root}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'validate' (not 'update'/'create-drop'): schema is owned by Flyway
# (src/main/resources/db/migration), which runs automatically on startup
# before Hibernate initializes. Hibernate only checks the mappings match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

# ----- HikariCP Connection Pool -----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Keepalive prevents TiDB Cloud from dropping idle connections
spring.datasource.hikari.keepalive-time=60000

# ----- Seeding & console: OFF in production -----
spring.sql.init.mode=never
app.data.seed=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ----- Thymeleaf: cache templates in prod -----
spring.thymeleaf.cache=true

# ----- Server -----
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ----- Logging -----
logging.level.org.springframework.security=WARN
logging.level.com.hospital.hms=INFO
logging.level.com.zaxxer.hikari=INFO

# ----- Cookies: require HTTPS in production (set behind a TLS-terminating proxy/load balancer) -----
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=native
