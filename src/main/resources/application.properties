spring.application.name=Hospital Management System

# Active profile: 'dev' uses H2 in-memory DB (zero setup), 'mysql' uses real MySQL,
# 'prod' uses env-var-driven MySQL with production-safe defaults (see application-prod.properties).
spring.profiles.active=prod

# ===== Actuator: only expose health (used for deploy-platform health checks) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# ===== Server =====
server.port=8080
server.error.include-message=always
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=native

# ===== Jackson =====
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== File upload (for future use) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Logging =====
logging.level.org.springframework.security=INFO
logging.level.com.hospital.hms=DEBUG