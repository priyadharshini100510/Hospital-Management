# ===== H2 In-Memory Database (zero setup - for quick run/demo) =====
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 in-memory DB is recreated fresh every run (create-drop above), so
# Flyway's versioned migrations (written for MySQL) don't apply here.
spring.flyway.enabled=false

# Load demo data on startup
spring.sql.init.mode=never
app.data.seed=true
