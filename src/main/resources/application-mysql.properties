# ===== MySQL Database Configuration =====
# Create the database first: CREATE DATABASE hospital_db;
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Schema is owned by Flyway (src/main/resources/db/migration), not Hibernate.
# 'validate' just checks the JPA mappings match what Flyway created.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.sql.init.mode=never
app.data.seed=true
